spring.application.name=backend

# ==========================================
# 1. Database Connection (PostgreSQL)
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/asset_management
spring.datasource.username=admin
spring.datasource.password=1111
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# 2. OpenAI Configuration
# ==========================================
# OpenAI API Key 입력 (또는 시스템 환경변수 OPENAI_API_KEY 사용)
spring.ai.openai.api-key=${OPENAI_API_KEY}
# OpenAI 임베딩 모델 설정 (text-embedding-3-small: 1536 차원)
spring.ai.openai.embedding.options.model=text-embedding-3-small

# ==========================================
# 3. Spring AI PgVectorStore Configuration
# ==========================================
# PgVector 관련 설정
spring.ai.vectorstore.pgvector.index-type=HNSW
# 기존 : spring.ai.vectorstore.pgvector.distance-type=COSINE (오류 발생)
# 수정 : COSINE_DISTANCE 로 변경
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.initialize-schema=true

